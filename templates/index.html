<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube → MP4 Player</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    input {
      width: 70%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }
    video {
      width: 100%;
      margin-top: 20px;
      background: #000;
      border-radius: 10px;
    }
    #status {
      margin-top: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>YouTube → MP4 Player</h1>
    <p>自分が権利を持つ動画など、取得・変換が許可されている動画で使ってください。</p>

    <input id="url" type="url" placeholder="YouTubeのURLを入力">
    <button id="play">再生</button>

    <div id="status"></div>
    <video id="player" controls style="display:none"></video>
  </div>

  <script>
    const urlInput = document.getElementById("url");
    const button = document.getElementById("play");
    const status = document.getElementById("status");
    const player = document.getElementById("player");

    button.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) {
        status.textContent = "YouTubeのURLを入力してください。";
        return;
      }

      button.disabled = true;
      player.style.display = "none";
      status.textContent = "動画を取得しています。しばらく待ってください…";

      try {
        const res = await fetch("/api/convert", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({url})
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || data.error || "取得に失敗しました。");
        }

        status.textContent = data.title;
        player.src = data.url;
        player.style.display = "block";
        await player.play().catch(() => {});
      } catch (err) {
        status.textContent = "エラー: " + err.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
